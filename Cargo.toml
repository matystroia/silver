[package]
name = "silver"
version = "0.1.0"
description = "An example generated using the simple template"
authors = ["Matei Stroia <stroiamatei@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.1", features = [
    "unstable-widget-ref",
    "unstable-rendered-line-info",
] }
color-eyre = "0.6.3"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive", "rc"] }
strum = { version = "0.28.0", features = ["derive"] }
directories-next = "2.0.0"
walkdir = "2.5.0"
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.31"
libc = "0.2.177"
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.16"
reqwest = "0.13.4"
chrono = { version = "0.4.42", features = ["serde"] }
toml = "1.1.2"
governor = "0.10.1"
nonzero_ext = "0.3.0"
regex = "1.12.2"
async-trait = "0.1.89"
image = "0.25.8"
ratatui-image = { version = "11.0", features = ["tokio"] }
ffmpeg-next = "8.1.0"
rayon = "1.12.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
itertools = "0.15.0"
schnellru = "0.2.4"
deunicode = "1.6.2"
strsim = "0.11.1"
kakasi = "0.1.0"
open = "5.3.6"
tl = "0.7.8"
html-escape = "0.2.13"

[lints.clippy]
clone_on_ref_ptr = "warn"

[dev-dependencies]
rstest = "0.26.1"
